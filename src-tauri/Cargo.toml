[package]
name = "claude-scope"
version = "0.3.1"
description = "Desktop GUI for promoting Claude Code settings between scopes"
authors = ["Brian Minier"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
default-run = "claude-scope"

[lib]
name = "claude_scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-scope-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
dirs = "6"
tempfile = "3"
notify-debouncer-mini = "0.7"
clap = { version = "4", features = ["derive"] }
ulid = { version = "1", features = ["serde"] }
# Cross-process file lock around audit-log rotate+append (#166). Both
# Windows (LockFileEx) and POSIX (flock) advisory locks via one API.
fs2 = "0.4"

[features]
# By default Tauri runs in production mode.
# When `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is set.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
