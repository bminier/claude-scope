[package]
name = "claude-scope"
version = "0.3.0"
description = "Desktop GUI for promoting Claude Code settings between scopes"
authors = ["Brian Minier"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "claude_scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
dirs = "6"
tempfile = "3"
notify-debouncer-mini = "0.7"

[features]
# By default Tauri runs in production mode.
# When `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is set.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
