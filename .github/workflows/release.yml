name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag to build (e.g. v0.1.0). Leave blank for a disposable "nightly-<full-sha>" draft pre-release.'
        required: false
        default: ""

# Serialize runs that target the *same release tag*, not the same git ref.
# A tag push (refs/tags/vX.Y.Z) and a workflow_dispatch rebuild of that
# same tag would otherwise get different concurrency groups (refs/tags/...
# vs refs/heads/...) and race on uploads to the shared draft release.
# Matching on the effective tagName keeps those two runs serialized.
# cancel-in-progress stays false because we'd rather wait than abandon a
# partially-uploaded draft.
concurrency:
  group: >-
    release-${{
      github.ref_type == 'tag' && github.ref_name
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '' && github.event.inputs.tag_name)
      || format('nightly-{0}', github.sha)
    }}
  cancel-in-progress: false

permissions:
  # Required for tauri-action to create/update a GitHub Release and upload
  # artifacts to it.
  contents: write

jobs:
  # Resolve what tag to publish under and what ref to check out, so every
  # matrix leg in `release` builds from the same commit and uploads to the
  # same draft release. On tag push both are just the tag. On
  # workflow_dispatch, an input tag wins; otherwise we synthesize a
  # disposable `nightly-<full-sha>` draft off the dispatched branch.
  setup:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.compute.outputs.release_tag }}
      checkout_ref: ${{ steps.compute.outputs.checkout_ref }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
    steps:
      - id: compute
        env:
          EVENT_NAME: ${{ github.event_name }}
          # `inputs` is only populated on workflow_dispatch / workflow_call;
          # `github.event.inputs` resolves safely to empty on tag pushes.
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_TAG" ]; then
              # Maintainer explicitly named a tag to rebuild — check that ref
              # out and publish under that exact name.
              echo "release_tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            else
              # No input — build a disposable nightly off the dispatched
              # commit. Checkout the immutable SHA (not the branch name) so
              # all matrix legs build the exact same tree even if new
              # commits land on the branch mid-run. Use the full SHA in the
              # tag to avoid any theoretical collision risk from a short
              # prefix and to match the concurrency-group key scheme below.
              echo "release_tag=nightly-$SHA" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=$SHA" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # push on a v*.*.* tag
            echo "release_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: setup
    name: release (${{ matrix.platform.os }})
    strategy:
      # Don't stop siblings on one-platform failure. If macOS trips but
      # Windows + Linux succeed we still want those installers uploaded
      # so the user can publish what's usable.
      fail-fast: false
      matrix:
        platform:
          # `target` is passed to `tauri build --target` via `args` so
          # cargo writes into `target/<triple>/release/` per-platform.
          # That makes rust-cache keying deterministic across matrix legs
          # and keeps installer naming architecture-explicit.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - os: macos-latest
            # Universal binary (arm64 + x86_64) in a single .dmg so the
            # download works on both Apple Silicon and Intel Macs.
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform.os }}

    steps:
      # Pull the exact ref the `setup` job resolved — for tag pushes this is
      # the tag, for dispatch-with-input this is the named tag, and for
      # dispatch-without-input this is the dispatched branch HEAD.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: npm

      # Pin the release toolchain so rebuilds of the same tag remain
      # deterministic over time. This is decoupled from the declared MSRV
      # — shipped binaries get the optimizer improvements of a newer Rust
      # while the `msrv` job in ci.yml continues to gate on 1.88.0.
      # Bump this pin deliberately when we want to ship with a newer
      # compiler; Dependabot is configured to ignore
      # `dtolnay/rust-toolchain` so bulk bumps can't do it silently.
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          # universal-apple-darwin needs both Mac targets installed so cargo
          # can cross-compile to the other arch from whichever the runner is.
          targets: ${{ matrix.platform.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          # Key the cache per-target so cross-compiled universal-apple-darwin
          # doesn't thrash the single-arch Linux/Windows caches.
          key: release-${{ matrix.platform.target }}

      - name: Install Linux bundler deps
        if: startsWith(matrix.platform.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - run: npm ci

      # macOS-only: pre-build claude-scope-cli for BOTH Apple architectures
      # and lipo them into a universal binary at the path Tauri's bundler
      # looks for. `tauri build --target universal-apple-darwin` does the
      # universal-build dance for the default binary (`claude-scope`) only,
      # but the bundler then walks every `[[bin]]` declared in Cargo.toml
      # and tries to copy each from `target/universal-apple-darwin/release/`
      # into the .app. Without this step the `claude-scope-cli` bin gets
      # built for the host arch only, in the wrong target dir, and the
      # bundler fails with "binary does not exist". Linux + Windows are
      # single-arch so this step is a no-op there.
      - name: Pre-build claude-scope-cli as macOS universal binary
        if: matrix.platform.os == 'macos-latest'
        working-directory: src-tauri
        run: |
          cargo build --release --bin claude-scope-cli --target aarch64-apple-darwin
          cargo build --release --bin claude-scope-cli --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/claude-scope-cli \
            target/x86_64-apple-darwin/release/claude-scope-cli \
            -output target/universal-apple-darwin/release/claude-scope-cli
          # Sanity-check the result reports both arches so a future
          # toolchain change can't silently regress to a single-arch
          # binary while still putting *a* file in the expected path.
          lipo -info target/universal-apple-darwin/release/claude-scope-cli

      # tauri-action runs `beforeBuildCommand` (which is `npm run build`)
      # before invoking `tauri build`, so the frontend dist/ is produced
      # as part of the same step. Pinned to a specific version rather than
      # `@v0` so rebuilds of an older tag don't silently pick up
      # behavior/bundler changes from a newer action release.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Create (or reuse) a draft release for the resolved tag. The
          # maintainer reviews the uploaded artifacts and publishes from
          # the GitHub UI — no surprise public release if a build is broken.
          tagName: ${{ needs.setup.outputs.release_tag }}
          releaseName: "ClaudeScope ${{ needs.setup.outputs.release_tag }}"
          releaseBody: |
            Binaries are attached below.

            Release notes can be edited here before publishing — use the
            Compare view at
            https://github.com/${{ github.repository }}/compare to diff
            this release against the previous tag.

            ⚠️ Builds are currently **unsigned**. On first launch you'll see:
            - **Windows**: a SmartScreen warning — click "More info" → "Run anyway".
            - **macOS**: a Gatekeeper warning — right-click the app → Open → Open.
            - **Linux**: no warning.
          releaseDraft: true
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          args: ${{ matrix.platform.args }}

      # tauri-bundler writes the macOS app-tarball to disk as
      # `<productName>.app.tar.gz` (no version component), unlike every other
      # artifact we ship (which is `<productName>_<version>_<arch>.<ext>`).
      # Then `tauri-action` renames on upload:
      #   * 0.5.x: uploads as `<productName>.app.tar.gz` unchanged.
      #   * 0.6.x: uploads as `<productName>_universal.app.tar.gz`.
      # Neither version includes the release version in the filename.
      # Rename post-upload via the Releases API so the name stays consistent
      # with the rest of the drop and older downloads don't silently mask
      # newer ones in a user's Downloads folder.
      #
      # Contract (in priority order):
      #   1. If `<product>_<version>_universal.app.tar.gz` is already on the
      #      release, exit 0 (idempotent re-run; or a future tauri-action
      #      that produces the versioned name itself).
      #   2. Otherwise look for any asset named `<product>…app.tar.gz` —
      #      covers the two known on-wire shapes above and any reasonable
      #      variant a future tauri-action might pick. PATCH it.
      #   3. Otherwise retry (eventual-consistency on the release-list
      #      endpoint), then fail — a silent skip on an unrecognized name
      #      would defeat the whole point of the step.
      - name: Version-stamp macOS .app.tar.gz
        if: matrix.platform.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          set -euo pipefail

          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          product=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          new_name="${product}_${version}_universal.app.tar.gz"

          # Draft releases don't have a git tag yet, so we can't use
          # /releases/tags/<tag>. List all releases and filter by tag_name.
          #
          # Three subtleties:
          #   * `gh api --paginate` emits one JSON array per page; pipe to
          #     `jq --slurp` so the filter sees every page as a single
          #     stream (otherwise a match on page N+1 after a miss on
          #     page N would produce a multi-line asset_id).
          #   * jq filters collect matching assets into an array; shell
          #     branches on `length`. Where a boolean is needed (the
          #     idempotency check) `any(...)` already yields strict
          #     true/false. No `first(...)`/`head -n1` means no SIGPIPE
          #     edge case to worry about.
          #   * RELEASE_TAG / product / new_name come from tauri.conf.json —
          #     pass via `--arg` so embedded quotes/backslashes can't break
          #     jq parsing.
          max_attempts=5
          sleep_secs=3
          asset_id=""
          matched_name=""
          for attempt in $(seq 1 $max_attempts); do
            assets_json=$(
              gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
                | jq --slurp --arg tag "$RELEASE_TAG" \
                    '[.[][] | select(.tag_name == $tag) | .assets[]?]'
            )

            # Collect every asset on the release whose name matches our
            # app-tarball shape (<product>*.app.tar.gz). This covers the
            # tauri-action 0.5 name (`ClaudeScope.app.tar.gz`), the 0.6
            # name (`ClaudeScope_universal.app.tar.gz`), and our target
            # `new_name`. We split the matches into
            # "already-renamed (== new_name)" vs "rename candidates
            # (everything else matching the shape)" so a rerun can't leave
            # both a versioned and an unversioned tarball on the release:
            #   * 0 candidates, has_new true  → idempotent, exit 0
            #   * 0 candidates, has_new false → retry (eventual consistency)
            #   * 1 candidate,  has_new false → normal rename
            #   * any other combo (has_new true AND candidates > 0, or
            #     candidates > 1) → fail loudly with every match listed
            matches=$(echo "$assets_json" | jq -c --arg product "$product" \
              '[.[] | select(.name | startswith($product) and endswith(".app.tar.gz"))]')
            has_new=$(echo "$matches" | jq -r --arg name "$new_name" \
              'any(.[]; .name == $name)')
            candidates=$(echo "$matches" | jq -c --arg name "$new_name" \
              '[.[] | select(.name != $name)]')
            candidate_count=$(echo "$candidates" | jq 'length')

            # Stale candidates next to new_name = a rerun uploaded a fresh
            # unversioned tarball alongside our renamed one. OR multiple
            # legacy names left over from tauri-action-version churn. Both
            # leave the release in an ambiguous state; refuse to pick.
            if [ "$has_new" = "true" ] && [ "$candidate_count" -gt 0 ]; then
              # `jq join(", ")` — shell `paste -sd ", " -` cycles
              # delimiters character-by-character, so with three+ matches
              # it would produce e.g. `a,b c,d` instead of consistent ", ".
              stale_names=$(echo "$candidates" | jq -r 'map(.name) | join(", ")')
              echo "::error::${new_name} is already on release ${RELEASE_TAG}, but so are stale ${product}*.app.tar.gz asset(s): ${stale_names}. Refusing to leave a duplicate tarball on the release — delete the stale asset(s) in the GitHub UI and re-run."
              exit 1
            fi

            if [ "$has_new" = "true" ]; then
              echo "asset ${new_name} already present and no stale siblings — nothing to rename (idempotent re-run or upstream rename)"
              exit 0
            fi

            if [ "$candidate_count" -gt 1 ]; then
              stale_names=$(echo "$candidates" | jq -r 'map(.name) | join(", ")')
              echo "::error::multiple assets match ${product}*.app.tar.gz on release ${RELEASE_TAG}: ${stale_names}. Refusing to rename one and leave the other orphaned. Delete the stale asset(s) in the GitHub UI and re-run this workflow."
              exit 1
            fi

            if [ "$candidate_count" -eq 1 ]; then
              asset_id=$(echo "$candidates" | jq -r '.[0].id')
              matched_name=$(echo "$candidates" | jq -r '.[0].name')
              break
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "no asset matching ${product}*.app.tar.gz found yet (attempt ${attempt}/${max_attempts}); waiting ${sleep_secs}s for GitHub's release listing to catch up"
              sleep "$sleep_secs"
            fi
          done

          if [ -z "$asset_id" ]; then
            echo "::error::no asset matching ${product}*.app.tar.gz found on release ${RELEASE_TAG} after ${max_attempts} attempts. tauri-bundler/tauri-action produced an unexpected name, or the upload failed. Not leaving the release with an inconsistent asset set."
            exit 1
          fi

          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            -f "name=${new_name}"
          echo "renamed ${matched_name} → ${new_name}"

  # Compute SHA-256 sums for every artifact on the (still-draft) release and
  # upload SHA256SUMS.txt as an extra asset. Builds are unsigned, so the sums
  # are the only integrity guarantee a downloader has. Runs once after every
  # matrix leg has finished uploading, so a single sums file covers all
  # platforms.
  #
  # Idempotency: an existing SHA256SUMS.txt is deleted before re-upload so
  # workflow_dispatch reruns of the same tag converge cleanly.
  sums:
    needs: [setup, release]
    # The release matrix is fail-fast: false on purpose — a single failed
    # platform leg shouldn't suppress checksums for the legs that did
    # publish. Run as long as setup succeeded (we need the release tag) and
    # the workflow wasn't cancelled. The asset_count==0 guard below still
    # exits 1 if every leg failed, so we don't silently publish an empty
    # SHA256SUMS.txt.
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          set -euo pipefail

          # Draft releases don't have a git tag pushed yet, so /releases/tags/<tag>
          # 404s. List all releases and filter by tag_name — same trick the
          # macOS Version-stamp step uses above.
          release_id=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              | jq --slurp -r --arg tag "$RELEASE_TAG" \
                  '[.[][] | select(.tag_name == $tag)] | (.[0].id // empty) | tostring'
          )
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "::error::no release found with tag ${RELEASE_TAG}"
            exit 1
          fi

          mkdir -p /tmp/release-assets
          cd /tmp/release-assets

          # List assets, skipping any prior SHA256SUMS.txt (we rewrite it).
          # Pull the binary bytes via the asset API directly so this works for
          # draft releases — `gh release download` only works on published.
          assets=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
              --paginate \
              | jq --slurp -c '[.[][] | select(.name != "SHA256SUMS.txt")]'
          )
          asset_count=$(echo "$assets" | jq 'length')
          if [ "$asset_count" -eq 0 ]; then
            echo "::error::release ${RELEASE_TAG} has no assets to checksum"
            exit 1
          fi

          # Download every asset by id. base64-roundtrip is the standard jq+bash
          # trick for handling rows that may contain spaces/quotes safely.
          for row in $(echo "$assets" | jq -r '.[] | @base64'); do
            row_json=$(echo "$row" | base64 -d)
            asset_id=$(echo "$row_json" | jq -r '.id')
            name=$(echo "$row_json" | jq -r '.name')
            # Defense in depth: asset names come from our Tauri matrix and
            # shouldn't contain path separators, but reject any that do so a
            # compromised upload can't escape the working directory.
            case "$name" in
              */*|*..*|"")
                echo "::error::refusing suspicious asset name: $name"
                exit 1
                ;;
            esac
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "$name"
          done

          # `--tag` produces BSD-style output (`SHA256 (file) = hash`) which
          # `sha256sum -c` can verify on any platform. `--` terminates option
          # parsing so a hypothetical asset name starting with `-` can't be
          # interpreted as a flag.
          sha256sum --tag -- * | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

          # Drop a stale SHA256SUMS.txt from a previous run (e.g.
          # workflow_dispatch rebuild of the same tag). Otherwise the upload
          # below would fail with 422 "already_exists".
          stale_id=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
              --paginate \
              | jq --slurp -r '[.[][] | select(.name == "SHA256SUMS.txt")] | (.[0].id // empty) | tostring'
          )
          if [ -n "$stale_id" ] && [ "$stale_id" != "null" ]; then
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${stale_id}"
          fi

          # Upload via the assets endpoint directly. `gh release upload` looks
          # up the release by tag, which works for drafts but only when the
          # auth user has permission *and* the `releases/tags/<tag>` endpoint
          # surfaces drafts — both have historically been wobbly. The macOS
          # Version-stamp step above already uses the assets endpoint
          # directly; mirror that pattern.
          gh api --method POST \
            -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=SHA256SUMS.txt" \
            --input SHA256SUMS.txt
