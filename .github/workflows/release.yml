name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual dispatch for dry-runs / testing the workflow itself without
  # cutting a tag. The dispatch run still produces a draft release, which
  # the maintainer can delete if it was just a test.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build (e.g. v0.1.0). Leave blank for "nightly-<sha>".'
        required: false
        default: ""

# Don't cancel in-progress releases when another tag lands — each release
# is distinct and we want all artifacts uploaded for all tags.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Required for tauri-action to create/update a GitHub Release and upload
  # artifacts to it.
  contents: write

jobs:
  release:
    name: release (${{ matrix.platform.os }})
    strategy:
      # Don't stop siblings on one-platform failure. If macOS trips but
      # Windows + Linux succeed we still want those installers uploaded
      # so the user can publish what's usable.
      fail-fast: false
      matrix:
        platform:
          # `target` is passed to `tauri build --target` so installer
          # names are architecture-explicit. `args` gets appended to the
          # build command per-platform.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - os: macos-latest
            # Universal binary (arm64 + x86_64) in a single .dmg so the
            # download works on both Apple Silicon and Intel Macs. Tauri
            # wires this up via `--target universal-apple-darwin`.
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin needs both Mac targets installed so cargo
          # can cross-compile to the other arch from whichever the runner is.
          targets: ${{ matrix.platform.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Key the cache per-target so cross-compiled universal-apple-darwin
          # doesn't thrash the single-arch Linux/Windows caches.
          key: release-${{ matrix.platform.target }}

      - name: Install Linux bundler deps
        if: startsWith(matrix.platform.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - run: npm ci

      # tauri-action runs `beforeBuildCommand` (which is `npm run build`)
      # before invoking `tauri build`, so the frontend dist/ is produced
      # as part of the same step.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Create (or reuse) a draft release matching this tag. The
          # maintainer reviews the uploaded artifacts and publishes by
          # hand from the GitHub UI — no surprise public release if a
          # build is broken.
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: "ClaudeScope ${{ github.event.inputs.tag_name || github.ref_name }}"
          releaseBody: |
            See CHANGELOG for details. Binaries are attached below.

            ⚠️ Builds are currently **unsigned**. On first launch you'll see:
            - **Windows**: a SmartScreen warning — click "More info" → "Run anyway".
            - **macOS**: a Gatekeeper warning — right-click the app → Open → Open.
            - **Linux**: no warning.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.args }}
