# Dependabot updates. Keeps Cargo, npm, and GitHub Actions deps fresh
# without anyone having to babysit them. Grouped to keep PR volume sane:
# one PR per ecosystem per week, with patch + minor updates bundled.
# Major bumps still land as separate PRs so they get real review.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    # Dependabot versions dtolnay/rust-toolchain tags as Rust releases
    # (1.88.0 → 1.89.0 → …). Our three pins serve different purposes:
    #   * ci.yml `msrv` job — must stay at the declared MSRV.
    #   * ci.yml `lint` job + release.yml — pinned for determinism, bump
    #     when we want newer clippy / shipped-compiler signal.
    # A bulk bump would bounce the msrv job off its own meaning. Pin
    # these by hand and keep Dependabot out of the loop.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
